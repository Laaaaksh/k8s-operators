                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: WebAppPhase mirrors v1alpha1.WebAppPhase - see that type's
                  comment.
                enum:
                - Pending
                - Progressing
                - Available
                - Degraded
                type: string
              readyReplicas:
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
