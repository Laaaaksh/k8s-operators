  annotations:
    cert-manager.io/inject-ca-from: webapp-operator-system/webapp-operator-serving-cert
    controller-gen.kubebuilder.io/version: v0.21.0
  name: webapps.apps.example.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: webapp-operator-webhook-service
          namespace: webapp-operator-system
          path: /convert
      conversionReviewVersions:
      - v1
  group: apps.example.com
  names:
    kind: WebApp
    listKind: WebAppList
    plural: webapps
    singular: webapp
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WebApp is the Schema for the webapps API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WebApp
            properties:
              hostName:
                description: |-
                  hostName is the externally-visible hostname this WebApp registers
                  under in the cluster's WebApp registry (see internal/registry). It
                  must be unique across every WebApp in the cluster - the registry is
                  how that's enforced. If empty, the mutating webhook introduced in
                  Stage 6 derives one from the WebApp's name and namespace.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              image:
                description: image is the container image to run, e.g. "nginx:1.27".
                minLength: 1
                type: string
              port:
                default: 8080
                description: |-
                  port is the container port the application listens on, and the port
                  the generated Service exposes.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                description: |-
                  replicas is the desired number of pods. Zero is valid and means
                  "scaled to zero, but still registered" - see status.phase.
                format: int32
                maximum: 100
                minimum: 0
                type: integer
            required:
            - image
            type: object
          status:
            description: status defines the observed state of WebApp
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the WebApp resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation the controller last
                  acted on. Compare it to .metadata.generation to tell whether Status
                  reflects the current Spec or a stale one the controller hasn't
                  gotten to yet.
                format: int64
                type: integer
              phase:
                description: |-
                  phase is a coarse summary of the WebApp's state. Always derived from
                  Conditions, never set independently - see the reconciler's
                  computePhase.
                enum:
                - Pending
                - Progressing
                - Available
                - Degraded
                type: string
              readyReplicas:
                description: readyReplicas mirrors the managed Deployment's status.readyReplicas.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.scaling.minReplicas
      name: Min
      type: integer
    - jsonPath: .spec.scaling.maxReplicas
      name: Max
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          WebApp is the Schema for the webapps API. This is the storage version
          (+kubebuilder:storageversion) and the conversion Hub - see
          webapp_conversion.go and curriculum/10-versioning.md. v1alpha1 remains
          served, converting through this type, for clients that haven't moved
          yet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WebApp
            properties:
              hostName:
                description: |-
                  hostName is the externally-visible hostname this WebApp registers
                  under in the cluster's WebApp registry. Unchanged from v1alpha1.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              image:
                description: image is the container image to run, e.g. "nginx:1.27".
                minLength: 1
                type: string
              port:
                default: 8080
                description: |-
                  port is the container port the application listens on, and the port
                  the generated Service exposes.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              scaling:
                default:
                  maxReplicas: 1
                  minReplicas: 1
                description: scaling replaces v1alpha1's flat "replicas" field. See
                  ScalingSpec.
                properties:
                  maxReplicas:
                    description: |-
                      maxReplicas is the ceiling. This repo's controller does not
                      implement autoscaling itself - it always runs exactly MinReplicas -
                      but the field exists so a real HorizontalPodAutoscaler (out of
                      scope here; see the root README's "what this repo doesn't cover")
                      has somewhere to read a ceiling from.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  minReplicas:
                    description: |-
                      minReplicas is the floor: the operator never runs fewer than this
                      many, even under an autoscaler.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - maxReplicas
                - minReplicas
                type: object
            required:
            - image
            type: object
          status:
            description: status defines the observed state of WebApp
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the WebApp resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
